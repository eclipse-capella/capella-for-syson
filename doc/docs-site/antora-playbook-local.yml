site:
  title: Capella for SysON Docs
  start_page: capella-for-syson::index.adoc
output:
  clean: true
content:
  sources:
    - url: ../..
      start_path: doc/content
      branches: HEAD
      worktrees: true
ui:
  bundle:
    url: ../doc-ui/build/ui-bundle.zip
asciidoc:
  attributes:
    icons: font
    sectanchors: ''
    sectlinks: ''
    sectnums: all
    page-toclevels: 3
antora:
  extensions:
    - require: '@antora/lunr-extension'
      languages: [en, fr]
